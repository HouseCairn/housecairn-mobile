name: housecairn_mobile
description: "Housecairn for iOS and Android: home upkeep and works, on the phone."
publish_to: 'none'
version: 0.5.1+1

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

# Every package here is listed in docs/adr/0001-flutter-stack-and-packages.md.
# Lot 1 takes only what it uses; the others come with their lots. Every
# dependency, direct or transitive, is checked against tool/licenses/allowed-licenses.txt
# (tool/check_licenses.dart, run in CI).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  # The controls of iOS on an iPhone (design lot D5, lib/design/adaptive.dart).
  cupertino_ui: ^1.1.6
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3: ^3.9.1
  intl: any
  uuid: ^4.6.0
  image_picker: ^1.2.4
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  image: 4.12.0
  yaml: ^3.1.4
  url_launcher: ^6.3.3
  decimal: ^3.2.6
  file_picker: 13.3.2
  crypto: ^3.0.6
  flutter_secure_storage: 11.2.0
  package_info_plus: 10.2.2
  share_plus: 13.3.1
  # QR labels (docs/adr/0014-qr-labels.md): the camera's frames, read by a
  # pure Dart port of ZXing; the code drawn from the matrix of `qr`; the
  # sheet of labels made by `pdf`.
  camera: 0.12.2
  zxing_lib: 1.1.4
  qr: 3.0.3
  pdf: 3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  # Manrope, the font of the web application, in the four weights the app
  # draws (assets/fonts/README.md, lib/design/tokens.dart HcFont.weights).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope-regular.ttf
          weight: 400
        - asset: assets/fonts/manrope-semibold.ttf
          weight: 600
        - asset: assets/fonts/manrope-bold.ttf
          weight: 700
        - asset: assets/fonts/manrope-extrabold.ttf
          weight: 800
  assets:
    # Shown on the licence page of About (lib/design/fonts.dart).
    - assets/fonts/Manrope-OFL.txt
    # The library of task templates, a copy of the web file
    # (tool/web_alignment.json), read by lib/domain/templates.dart.
    - assets/task_templates.yaml
    # The cairn of the bar of the app (design/brand/housecairn-icon.svg of the
    # web, drawn at 1x, 2x and 3x by tool/generate_icons.py).
    - assets/brand/housecairn-icon.png
    # The interactive guide and the glossary its sentences cite, copies of the
    # web files (tool/web_alignment.json; web ADR 0084). Read from design/,
    # where the web keeps them, so that the bytes are the web's.
    - design/guide.json
    - design/glossary.json
