# Static analysis: `flutter analyze --fatal-infos` in CI, with the lints of
# flutter_lints and a few stricter rules. Generated files are excluded: they
# are checked by regenerating them (CI, "Generated files are up to date").
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/app_localizations*.dart
    - "**/*.g.dart"
    - test/drift/**/generated/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_single_quotes
    - unawaited_futures
