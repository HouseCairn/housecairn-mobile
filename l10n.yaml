# Flutter gen-l10n (docs/spec.md, "Languages"): English is the source language,
# French ships in v1. `flutter pub get` regenerates lib/l10n/app_localizations*.dart
# from the ARB files; CI checks that the committed files are up to date.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
required-resource-attributes: true
untranslated-messages-file: build/untranslated-messages.json
