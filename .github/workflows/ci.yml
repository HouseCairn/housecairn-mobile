# Checks, tests and builds of the app (lot 1 of docs/plan.md), on every pull
# request, every merge queue entry and every push to `main`. Job names are the
# status checks a ruleset of `main` may require: rename them only together.
#
# The Android and iOS builds run only when the change can alter the app (paths
# listed in .github/scripts/app-changed.sh). No `paths` filter on the trigger:
# those jobs are required checks, and a workflow that does not run leaves them
# pending. Instead the `changes` job compares the commits and the two builds are
# skipped, which a ruleset counts as passing. The checks job (format, analyze,
# tests, licences) always runs. If `changes` fails or says nothing, the builds run.
#
# No third-party action: Flutter is installed from its official archive by
# .github/scripts/install-flutter.sh (pinned version, SHA-256 checked on every
# run); actions/cache only keeps the downloads between runs. Every action is
# pinned to a full commit SHA.
name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Does the change touch the app?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.detect.outputs.app }}
    steps:
      - name: Check out (full history, to compare with the base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with the base
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) old="$PR_BASE"; new=HEAD ;;
            merge_group) old="$GROUP_BASE"; new="$HEAD_SHA" ;;
            push) old="$PUSH_BEFORE"; new="$HEAD_SHA" ;;
            *) old=""; new=HEAD ;;
          esac
          if [ -z "$old" ]; then
            echo "No base to compare with on a $EVENT event: building."
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            .github/scripts/app-changed.sh diff "$old" "$new"
          fi
          {
            echo "### Does the change touch the app?"
            echo
            if grep -qx 'app=true' "$GITHUB_OUTPUT"; then
              echo "Yes (or not sure): the Android and iOS builds run."
            else
              echo "No: the Android and iOS builds are skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Format, analyze, tests and licences
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache the Flutter archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/housecairn-ci/flutter-archives
          key: flutter-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/install-flutter.sh') }}
      - name: Install Flutter (pinned, checksum verified)
        run: .github/scripts/install-flutter.sh "$HOME/.cache/housecairn-ci/flutter-archives"
      - name: Cache the pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Get the locked packages (flutter pub get --enforce-lockfile)
        run: flutter pub get --enforce-lockfile
      - name: Generated files are up to date (gen-l10n, drift)
        run: |
          flutter gen-l10n
          dart run build_runner build
          dart run drift_dev schema generate drift_schemas/housecairn/ test/drift/housecairn/generated/
          dart run drift_dev make-migrations
          git status --porcelain
          test -z "$(git status --porcelain)" || { git diff; echo "::error::Generated files differ from the committed ones: regenerate them."; exit 1; }
      - name: Format (dart format)
        run: dart format --output=none --set-exit-if-changed lib test test_e2e tool
      - name: Analyze (flutter analyze)
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests (flutter test)
        run: flutter test --reporter expanded
      - name: Licences of every dependency (tool/check_licenses.dart)
        run: dart run tool/check_licenses.dart
      - name: App icons (tests, generated files up to date, preview)
        # Python standard library only. The preview is a contact sheet of the iOS and
        # Android icons at three sizes, generated from the committed files' source.
        run: |
          python3 tool/test_generate_icons.py
          python3 tool/generate_icons.py --preview "$RUNNER_TEMP/app-icons-preview.png"
          cp "$RUNNER_TEMP/app-icons-preview.png" app-icons-preview.png
      - name: Keep the icon preview (14 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: housecairn-app-icons-preview
          path: app-icons-preview.png
          retention-days: 14
          if-no-files-found: error
      - name: CLA workflow script tests (node --test, no network)
        # Node.js is preinstalled on the runner image; the tests use only
        # Node's built-in modules.
        run: node --test .github/scripts/cla.test.js
      - name: Change detection tests (shell, throwaway repository)
        run: .github/scripts/test-app-changed.sh

  web-alignment:
    # The rules the app carries from the web application are those of the web
    # release pinned in tool/web_alignment.json: the recurrence vectors are
    # regenerated at that commit and compared byte for byte (a vector edited by
    # hand fails), the task templates too, the design tokens value by value.
    name: Web alignment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone the web application
        run: git clone --quiet --filter=blob:none https://github.com/HouseCairn/housecairn "$RUNNER_TEMP/web"
      - name: Tests of tool/web_alignment.py (no release without a gap, patch limited to its files, pin errors)
        run: python3 tool/test_web_alignment.py
      - name: Install uv (pinned, checksum verified)
        run: .github/scripts/install-uv.sh "$RUNNER_TEMP/uv-archive"
      - name: The app carries what its pinned web release gives (tool/web_alignment.py check)
        run: python3 tool/web_alignment.py check --web "$RUNNER_TEMP/web"

  server-e2e:
    # The third way against a real Housecairn server (docs/plan.md, lot 4b):
    # the web release that brings the sync API, started from its published
    # image pinned by digest, on the loopback of the runner (plain HTTP to a
    # local IP literal, the rule of docs/protocol.md section 2.10). The test
    # signs in by the real consent page and OAuth flow with PKCE, then syncs
    # both ways and reads the result through the web API. The image is the
    # `edge` build of web `main` at 466f66c, not a release: v0.5.2 does not
    # send the fields of the real cost the server keeps (web ADR 0092), which
    # the real cost tests read. Move it to the first release that has them.
    name: Sync with a Housecairn server (e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HC_SERVER_IMAGE: ghcr.io/housecairn/housecairn:sha-466f66c@sha256:bad0477c4b2d99980d38d1ae2ed5d40809e2fa9a992b3b0d0cae0293cedf0490
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the Housecairn server (main at 466f66c, pinned by digest)
        run: |
          docker run --detach --name housecairn --publish 127.0.0.1:8000:8000 \
            --env ALLOWED_HOSTS=127.0.0.1 \
            --env SECURE_SSL_REDIRECT=false \
            --env HOUSECAIRN_FORWARDED_ALLOW_IPS=192.0.2.1 \
            "$HC_SERVER_IMAGE"
          for _ in $(seq 1 90); do
            if curl --silent --fail --max-redirs 0 http://127.0.0.1:8000/api/v1/sync/info >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs housecairn
          exit 1
      - name: Prepare an account, two homes, a session and an API token (tool/e2e/provision.py)
        run: |
          docker exec -i housecairn python -m housecairn.entrypoint manage shell \
            < tool/e2e/provision.py > "$RUNNER_TEMP/provision.out"
          line="$(grep '^E2E ' "$RUNNER_TEMP/provision.out" | head -n 1)"
          test -n "$line" || { cat "$RUNNER_TEMP/provision.out"; exit 1; }
          python3 -c 'import json, sys
          for key, value in json.loads(sys.argv[1][4:]).items():
              print(f"::add-mask::{value}")
              print(f"{key}={value}")' "$line" > "$RUNNER_TEMP/provision.env"
          grep '^::add-mask::' "$RUNNER_TEMP/provision.env"
          grep -v '^::add-mask::' "$RUNNER_TEMP/provision.env" >> "$GITHUB_ENV"
      - name: Cache the Flutter archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/housecairn-ci/flutter-archives
          key: flutter-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/install-flutter.sh') }}
      - name: Install Flutter (pinned, checksum verified)
        run: .github/scripts/install-flutter.sh "$HOME/.cache/housecairn-ci/flutter-archives"
      - name: Cache the pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Get the locked packages (flutter pub get --enforce-lockfile)
        run: flutter pub get --enforce-lockfile
      - name: The phone against the server (flutter test test_e2e)
        env:
          HC_E2E_URL: http://127.0.0.1:8000
        run: flutter test --reporter expanded test_e2e
      - name: Server log on failure
        if: failure()
        run: docker logs housecairn 2>&1 | tail -n 200

  android:
    name: Android build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache the Flutter archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/housecairn-ci/flutter-archives
          key: flutter-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/install-flutter.sh') }}
      - name: Install Flutter (pinned, checksum verified)
        run: .github/scripts/install-flutter.sh "$HOME/.cache/housecairn-ci/flutter-archives"
      - name: Cache the pub packages and Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Get the locked packages
        run: flutter pub get --enforce-lockfile
      - name: Build the APK (release mode, signed with the debug key)
        # Not for distribution: the release signing key comes with lot 8. The
        # debug signature lets the maintainer install it on a phone (Device).
        run: flutter build apk --release
      - name: The Android package is app.housecairn.mobile (from the APK)
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          "$aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -E "^(package|application-label|sdkVersion|targetSdkVersion|uses-permission|locales)" "$RUNNER_TEMP/badging.txt"
          package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt")
          echo "Android package: $package"
          test "$package" = "app.housecairn.mobile"
          sha256sum "$apk"
      - name: The APK carries the Housecairn icon (adaptive, from the APK)
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          "$aapt2" dump badging "$apk" | grep -E "^(application-icon|application:)"
          "$aapt2" dump badging "$apk" | grep -q "^application-icon-65534:'res/.*\.xml'"
          # 65534 is the "any density" entry: the adaptive icon is an XML resource
          # (its path is obfuscated by resource shrinking, hence not matched by name).
      - name: Keep the APK (14 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: housecairn-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    name: iOS build (unsigned)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache the Flutter archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/housecairn-ci/flutter-archives
          key: flutter-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/install-flutter.sh') }}
      - name: Install Flutter (pinned, checksum verified)
        run: .github/scripts/install-flutter.sh "$HOME/.cache/housecairn-ci/flutter-archives"
      - name: Cache the pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Get the locked packages
        run: flutter pub get --enforce-lockfile
      - name: Build for iOS without signing
        # No certificate, no secret: the build is not installable on an
        # iPhone (see the Device steps of the pull request of lot 1).
        run: |
          xcodebuild -version
          flutter build ios --release --no-codesign
      - name: The iOS bundle id is app.housecairn.mobile (from the .app)
        run: |
          plist=build/ios/iphoneos/Runner.app/Info.plist
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          echo "iOS bundle id: $bundle"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations' "$plist"
          test "$bundle" = "app.housecairn.mobile"
      - name: The .app carries the Housecairn icon (Assets.car, CFBundleIcons)
        run: |
          app=build/ios/iphoneos/Runner.app
          test -f "$app/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist" | grep -qx AppIcon
          xcrun assetutil --info "$app/Assets.car" | grep -E '"Name" : "AppIcon"' | sort | uniq -c
          xcrun assetutil --info "$app/Assets.car" | grep -q '"Name" : "AppIcon"'
