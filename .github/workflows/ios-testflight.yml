# TestFlight builds of the app (lot 1b of docs/plan.md, ADR 0009): a signed
# iOS build uploaded to App Store Connect on every push to `main`, and on a
# manual run from `main`, once the maintainer enables it.
#
# Two jobs:
# - `plan` runs on every event, pull requests and merge queue entries
#   included. It checks the committed export options and says in the run
#   summary whether this run uploads, and why not. It never reads a secret.
# - `upload` runs only on `main`, and only when the repository variable
#   TESTFLIGHT_UPLOAD is "true". Until then it is skipped, never failed. It is
#   the only job that enters the `testflight` environment, so that environment
#   is never created by a run (GitHub creates a missing environment that a job
#   references) and its secrets never reach a pull request.
#
# Signing: the archive is built unsigned; `xcodebuild -exportArchive` signs it
# with a cloud-managed distribution certificate and uploads it, authenticated
# by an App Store Connect API key (-allowProvisioningUpdates with
# -authenticationKeyPath, -authenticationKeyID, -authenticationKeyIssuerID).
# No certificate, profile or keychain on the runner. The key is written to a
# file readable by the job's user only and removed at the end of its step and
# again at the end of the job, failed or not; it is never printed.
#
# Secrets of the `testflight` environment: ASC_KEY_ID, ASC_ISSUER_ID,
# ASC_KEY_P8 (text of the .p8 file), APPLE_TEAM_ID.
#
# No third-party action and no cache in the upload job: Flutter comes from its
# official archive (.github/scripts/install-flutter.sh, SHA-256 checked), the
# rest is xcodebuild, xcrun and plutil of Xcode. Every action is pinned to a
# full commit SHA. None of these jobs is a required check of `main`.
name: iOS TestFlight

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    # Only what changes the delivered app sends a build: a merge of
    # documentation, issue forms or tests uploads nothing. Keep in step with
    # .github/scripts/app-changed.sh. A manual run is never filtered.
    paths:
      - lib/**
      - ios/**
      - assets/**
      - fonts/**
      - pubspec.yaml
      - pubspec.lock
      - l10n.yaml
      - build.yaml
      - .github/scripts/install-flutter.sh
      - .github/scripts/app-changed.sh
      - .github/scripts/check_testflight_config.py
      - .github/workflows/ios-testflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # An upload in progress is never cancelled. A run of `main` waiting behind it is
  # replaced by a newer one, so some merges send no build; the newest run always
  # has the highest build number.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: TestFlight plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      upload: ${{ steps.decide.outputs.upload }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export options and Info.plist are as expected
        run: python3 .github/scripts/check_testflight_config.py
      - name: Decide whether this run uploads
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ENABLED: ${{ vars.TESTFLIGHT_UPLOAD }}
        run: |
          upload=false
          if [ "$EVENT" != "push" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            reason="a ${EVENT} event never uploads; only a push to main or a manual run on main does"
          elif [ "$REF" != "refs/heads/main" ]; then
            reason="only main uploads, this run is on ${REF}"
          elif [ "$ENABLED" != "true" ]; then
            reason="uploads are not enabled: the repository variable TESTFLIGHT_UPLOAD is not \"true\""
          else
            upload=true
            reason="push or manual run on main, uploads enabled"
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "TestFlight upload: $upload ($reason)"
          {
            echo "### TestFlight"
            echo
            if [ "$upload" = "true" ]; then
              echo "Upload: **yes** ($reason)."
            else
              echo "Upload: **skipped**, $reason. The \`TestFlight upload\` job is skipped, not failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  upload:
    name: TestFlight upload
    needs: plan
    if: needs.plan.outputs.upload == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    permissions:
      contents: read
    env:
      # App Store Connect takes iOS builds made with Xcode 26 or later. The
      # path is pinned so that a change of the image's default Xcode does not
      # change the build; update it with the runner image.
      XCODE_APP: /Applications/Xcode_26.6.app
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The four secrets of the environment are set
        # Uploads are enabled (see the plan job): a missing secret is a
        # configuration error, and the job fails instead of skipping.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets of the testflight environment:$missing"
            exit 1
          fi
          echo "The four secrets are set."
      - name: Select Xcode (26 or later)
        run: |
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          major=$(xcodebuild -version | sed -n 's/^Xcode \([0-9][0-9]*\).*/\1/p')
          test "${major:-0}" -ge 26
      - name: Install Flutter (pinned, checksum verified, no cache)
        run: .github/scripts/install-flutter.sh "$RUNNER_TEMP/flutter-archives"
      - name: Get the locked packages
        run: flutter pub get --enforce-lockfile
      - name: Configure the Xcode project (build number from the run number)
        run: flutter build ios --release --config-only --no-codesign --build-number "$BUILD_NUMBER"
      - name: Archive, unsigned (signing happens at export)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
      - name: The archive is app.housecairn.mobile with this build number
        run: |
          plist="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app/Info.plist"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          echo "Bundle id $bundle, version $version, build $build"
          test "$bundle" = "app.housecairn.mobile"
          test "$build" = "$BUILD_NUMBER"
      - name: Sign with cloud signing and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/asc-key" "$RUNNER_TEMP/ExportOptions.plist"' EXIT
          mkdir -p "$RUNNER_TEMP/asc-key"
          key="$RUNNER_TEMP/asc-key/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          cp ios/ExportOptions-testflight.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the key, whatever happened
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc-key" "$RUNNER_TEMP/ExportOptions.plist"
      - name: Summary
        env:
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### TestFlight"
            echo
            echo "Build **$BUILD_NUMBER** of commit \`$SHA\` uploaded to App Store Connect."
            echo "Apple processes it before it can be tested."
          } >> "$GITHUB_STEP_SUMMARY"
