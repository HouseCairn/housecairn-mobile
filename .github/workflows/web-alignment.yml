# A pull request that aligns the app on the latest release of the web
# application (docs/plan.md, Alignment with the web application).
#
# Every day, and on demand: take the latest published release of
# HouseCairn/housecairn (public API, no token), regenerate the recurrence
# vectors, export the task templates and read the design tokens at that
# release (tool/web_alignment.py update), and compare with what the app
# carries. When something differs, run the tests on the regenerated files,
# then open, or update, the one pull request of the branch
# web-alignment/housecairn, with the new pin of tool/web_alignment.json. When
# the tests fail, the web changed a rule that needs Dart code: the pull request
# says so, and its CI stays red until the code is ported on that branch.
#
# The pull request is opened with a token of the project's GitHub App, the same
# App and the same names as the app update of HouseCairn/home-assistant-addons,
# so that its own checks run (a pull request opened with GITHUB_TOKEN starts no
# workflow). The App's key is a secret of the `app-update` environment, limited
# to the main branch: no pull_request event, and no fork, can read it. The job
# that runs the web code and the tests has no secret and a read-only token; the
# job with the App's token only applies their patch and calls the API. Without
# the App, the run stops red after the comparison, with the report in its
# summary.
name: Web alignment

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BRANCH: web-alignment/housecairn

jobs:
  compare:
    name: Compare with the latest web release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read # check out the repository
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Latest release of the web application (public API)
        id: release
        run: |
          set -euo pipefail
          release=$(curl --fail --silent --show-error --location --retry 4 --proto '=https' \
            https://api.github.com/repos/HouseCairn/housecairn/releases/latest \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')
          [[ "$release" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected tag: $release"; exit 1; }
          echo "Latest web release: $release"
          echo "release=$release" >>"$GITHUB_OUTPUT"
      - name: Clone the web application
        run: git clone --quiet --filter=blob:none https://github.com/HouseCairn/housecairn "$RUNNER_TEMP/web"
      - name: Install uv (pinned, checksum verified)
        run: .github/scripts/install-uv.sh "$RUNNER_TEMP/uv-archive"
      - name: Regenerate what the app carries at that release
        id: update
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python3 tool/web_alignment.py update --web "$RUNNER_TEMP/web" --release "$RELEASE" \
            --report "$RUNNER_TEMP/out/report.md" | tee "$RUNNER_TEMP/update.log"
          git add --all
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            git diff --cached --binary >"$RUNNER_TEMP/out/alignment.patch"
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Install Flutter (pinned, checksum verified)
        if: steps.update.outputs.changed == 'true'
        run: .github/scripts/install-flutter.sh "$RUNNER_TEMP/flutter-archives"
      - name: Tests on the regenerated files (flutter test)
        if: steps.update.outputs.changed == 'true'
        run: |
          set -uo pipefail
          flutter pub get --enforce-lockfile
          flutter test --reporter expanded >"$RUNNER_TEMP/test.log" 2>&1
          status=$?
          tail -n 60 "$RUNNER_TEMP/test.log"
          if [ "$status" -eq 0 ]; then echo passed; else echo failed; fi >"$RUNNER_TEMP/out/tests.txt"
          tail -n 40 "$RUNNER_TEMP/test.log" >"$RUNNER_TEMP/out/tests-tail.txt"
      - name: Keep the patch and the report for the pull request job
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-alignment
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error
      - name: Summary
        env:
          CHANGED: ${{ steps.update.outputs.changed }}
        run: |
          {
            if [ "$CHANGED" = true ]; then
              echo "The app differs from the latest web release (tests: $(cat "$RUNNER_TEMP/out/tests.txt"))."
            else
              echo "The app is aligned on the latest web release: nothing to do."
            fi
            echo
            cat "$RUNNER_TEMP/out/report.md"
          } >>"$GITHUB_STEP_SUMMARY"

  pull-request:
    name: Open or update the pull request
    needs: compare
    if: needs.compare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds the App's key; its deployment rule limits it to main.
    environment: app-update
    permissions: {}
    steps:
      - name: Require the project's GitHub App
        env:
          CLIENT_ID: ${{ vars.APP_UPDATE_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::The app differs from the latest web release (see the summary of the" \
              "compare job), but the app-update environment has no APP_UPDATE_CLIENT_ID variable and" \
              "APP_UPDATE_PRIVATE_KEY secret: align it by hand (CONTRIBUTING.md), or set up the App."
            exit 1
          fi
      - name: Token of the App, for this repository only
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_UPDATE_CLIENT_ID }}
          private-key: ${{ secrets.APP_UPDATE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Get the patch and the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-alignment
          path: ${{ runner.temp }}/out
      - name: Commit the regenerated files
        id: change
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          RELEASE: ${{ needs.compare.outputs.release }}
        run: |
          set -euo pipefail
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          email="${bot_id}+${bot}@users.noreply.github.com"
          # One branch, one pull request: replaced only if every commit on it is
          # the App's, so that Dart code pushed there by a person is never lost.
          if git fetch --quiet origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null; then
            others=$(git log --format=%ae "origin/main..origin/$BRANCH" | grep -vxF "$email" || true)
            if [ -n "$others" ]; then
              echo "::error::$BRANCH has commits that are not the App's: align it by hand on $RELEASE."
              exit 1
            fi
          fi
          git switch --quiet -C "$BRANCH"
          git apply --index "$RUNNER_TEMP/out/alignment.patch"
          git config user.name "$bot"
          git config user.email "$email"
          git commit --quiet --signoff -m "chore(alignment): align the app on HouseCairn $RELEASE (tool/web_alignment.py)"
          git show --stat HEAD
          if git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null \
            && git diff --quiet "origin/$BRANCH" HEAD; then
            echo "push=false" >>"$GITHUB_OUTPUT"
          else
            echo "push=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Push the branch and open or update the pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE: ${{ needs.compare.outputs.release }}
          PUSH: ${{ steps.change.outputs.push }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$PUSH" = true ]; then
            git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" \
              "HEAD:refs/heads/$BRANCH"
          fi
          out="$RUNNER_TEMP/out"
          body="$out/body.md"
          {
            if [ "$(cat "$out/tests.txt")" = passed ]; then
              echo "The app differs from Housecairn $RELEASE in what regenerates mechanically; with the"
              echo "regenerated files, \`flutter test\` passes ([run]($RUN_URL))."
            else
              echo "> [!WARNING]"
              echo "> **Dart code needed.** With the files regenerated from Housecairn $RELEASE,"
              echo "> \`flutter test\` fails ([run]($RUN_URL)): a rule changed on the web. Port it on this"
              echo "> branch (\`lib/domain/recurrence.dart\` for the recurrence, \`lib/design/\` for the"
              echo "> tokens) before merging; the CI of this pull request stays red until then."
            fi
            echo
            echo "## What changed"
            echo
            cat "$out/report.md"
            echo
            echo "## Before merging"
            echo
            echo "- [ ] Read the web files listed above, and the release notes of $RELEASE."
            echo "- [ ] A web file cited by \`docs/spec.md\` changed: update the spec in this pull request."
            echo "- [ ] The checks pass."
            if [ "$(cat "$out/tests.txt")" != passed ]; then
              echo
              echo "<details><summary>End of the failed test run</summary>"
              echo
              echo '```text'
              cat "$out/tests-tail.txt"
              echo '```'
              echo
              echo "</details>"
            fi
            echo
            echo "Opened by the Web alignment workflow (\`.github/workflows/web-alignment.yml\`)."
          } >"$body"
          title="chore(alignment): align the app on HouseCairn $RELEASE"
          number=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPOSITORY" --title "$title" --body-file "$body"
            echo "Updated pull request #$number." >>"$GITHUB_STEP_SUMMARY"
          else
            gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" --title "$title" --body-file "$body"
            echo "Opened a pull request for Housecairn $RELEASE." >>"$GITHUB_STEP_SUMMARY"
          fi
