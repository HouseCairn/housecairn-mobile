# Dependency updates, as in the web repository (HouseCairn/housecairn,
# docs/adr/0014): weekly, minor and patch updates grouped per ecosystem, and a
# 7-day cooldown: a new release is only proposed once it has been public for a
# week, so that a compromised release has time to be noticed and withdrawn.
# Security updates are not delayed by the cooldown.
#
# The Flutter SDK itself is not a pub package: its version and checksums are
# pinned in .github/scripts/install-flutter.sh and updated by hand. Every new
# package an update brings is checked by tool/check_licenses.dart in CI.
version: 2

updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
